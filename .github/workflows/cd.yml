name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: reviewer-repo
  SERVICE_NAME: code-reviewer
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
          # Detect existing Docker repository in region or create fallback
          EXISTING_REPO=$(gcloud artifacts repositories list --location=${{ env.GAR_LOCATION }} --format="value(name)" 2>/dev/null | head -n 1 | awk -F'/' '{print $NF}')
          if [ -n "$EXISTING_REPO" ]; then
            echo "Using existing Artifact Registry repository: $EXISTING_REPO"
            echo "REPOSITORY=$EXISTING_REPO" >> $GITHUB_ENV
          else
            echo "Creating Artifact Registry repository: ${{ env.REPOSITORY }}"
            gcloud artifacts repositories create ${{ env.REPOSITORY }} \
              --repository-format=docker \
              --location=${{ env.GAR_LOCATION }} \
              --description="Docker repository for code reviewer" \
              --quiet || true
            echo "REPOSITORY=${{ env.REPOSITORY }}" >> $GITHUB_ENV
          fi

      - name: Build & Tag Container Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: "--allow-unauthenticated --traffic=100"


name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  SERVICE_NAME: code-reviewer
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Build, Tag & Push Container Image
        run: |
          echo "=== 1. Configure Docker Authentication ==="
          gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev" --quiet

          echo "=== 2. Resolving Artifact Registry Repository ==="
          # List repositories in the target location
          echo "Listing Artifact Registry repositories in ${{ env.GAR_LOCATION }}..."
          gcloud artifacts repositories list --location="${{ env.GAR_LOCATION }}" || true

          # Find existing Docker repository in GAR_LOCATION
          REPO_NAME=$(gcloud artifacts repositories list --location="${{ env.GAR_LOCATION }}" --filter="format=DOCKER" --format="value(name)" 2>/dev/null | head -n 1 | awk -F'/' '{print $NF}')
          REG_LOC="${{ env.GAR_LOCATION }}"

          # If no Docker repository in GAR_LOCATION, check all locations in the project
          if [ -z "$REPO_NAME" ]; then
            echo "No Docker repository found in ${{ env.GAR_LOCATION }}. Checking across all locations..."
            FULL_REPO=$(gcloud artifacts repositories list --filter="format=DOCKER" --format="value(name)" 2>/dev/null | head -n 1)
            if [ -n "$FULL_REPO" ]; then
              REPO_NAME=$(echo "$FULL_REPO" | awk -F'/' '{print $NF}')
              DETECTED_LOC=$(echo "$FULL_REPO" | awk -F'/' '{print $4}')
              if [ -n "$DETECTED_LOC" ]; then
                REG_LOC="$DETECTED_LOC"
                echo "Found Docker repository in alternate location: $REPO_NAME in $REG_LOC"
                gcloud auth configure-docker "${REG_LOC}-docker.pkg.dev" --quiet
              fi
            fi
          fi

          # If still no repository found, attempt to create reviewer-repo
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="reviewer-repo"
            echo "No existing repository found. Attempting to create $REPO_NAME in $REG_LOC..."
            gcloud artifacts repositories create "$REPO_NAME" \
              --repository-format=docker \
              --location="$REG_LOC" \
              --description="Docker repository for code reviewer" \
              --quiet || echo "Notice: repository create command completed (may already exist or need admin role)."
          fi

          echo "Selected Artifact Registry repository: $REPO_NAME in $REG_LOC"

          # Construct container image tags
          IMAGE_TAG="${REG_LOC}-docker.pkg.dev/${{ env.PROJECT_ID }}/${REPO_NAME}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${REG_LOC}-docker.pkg.dev/${{ env.PROJECT_ID }}/${REPO_NAME}/${{ env.SERVICE_NAME }}:latest"

          echo "Target Image Tag: $IMAGE_TAG"
          echo "Target Latest Tag: $LATEST_TAG"

          echo "=== 3. Build Docker Image ==="
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .

          echo "=== 4. Push Docker Image to Artifact Registry ==="
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: "--allow-unauthenticated --traffic=100"

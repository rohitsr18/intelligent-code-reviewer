name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  SERVICE_NAME: code-reviewer
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Build, Tag & Push Container Image
        run: |
          echo "=== 1. Configure Docker Authentication ==="
          gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev" --quiet

          echo "=== 2. Resolving Artifact Registry Repository ==="
          echo "Listing all Artifact Registry repositories in project:"
          gcloud artifacts repositories list || true

          REG_LOC="${{ env.GAR_LOCATION }}"
          REPO_NAME=""
          IMAGE_BASE=""

          # 1. Check if dedicated reviewer-repo already exists in target location
          if gcloud artifacts repositories describe reviewer-repo --location="$REG_LOC" >/dev/null 2>&1; then
            REPO_NAME="reviewer-repo"
            echo "Verified existing repository: $REPO_NAME"
          else
            echo "Repository 'reviewer-repo' not found in $REG_LOC. Attempting creation..."
            if gcloud artifacts repositories create reviewer-repo \
                --repository-format=docker \
                --location="$REG_LOC" \
                --description="Docker repository for code reviewer" \
                --quiet; then
              REPO_NAME="reviewer-repo"
              echo "Successfully created repository: $REPO_NAME"
            else
              echo "Could not create 'reviewer-repo'. Searching for existing non-gcr.io Docker repositories..."
              # Query repositories in GAR_LOCATION, ignoring legacy gcr.io
              REPO_NAME=$(gcloud artifacts repositories list --location="$REG_LOC" --filter="format=DOCKER AND NOT name:gcr.io" --format="value(name)" 2>/dev/null | head -n 1 | awk -F'/' '{print $NF}')

              # If not found in GAR_LOCATION, search across all locations in project
              if [ -z "$REPO_NAME" ]; then
                FULL_REPO=$(gcloud artifacts repositories list --filter="format=DOCKER AND NOT name:gcr.io" --format="value(name)" 2>/dev/null | head -n 1)
                if [ -n "$FULL_REPO" ]; then
                  REPO_NAME=$(echo "$FULL_REPO" | awk -F'/' '{print $NF}')
                  DETECTED_LOC=$(echo "$FULL_REPO" | awk -F'/' '{print $4}')
                  if [ -n "$DETECTED_LOC" ]; then
                    REG_LOC="$DETECTED_LOC"
                    echo "Found alternate Docker repository: $REPO_NAME in $REG_LOC"
                    gcloud auth configure-docker "${REG_LOC}-docker.pkg.dev" --quiet
                  fi
                fi
              fi

              # Fallback if no other repository exists
              if [ -z "$REPO_NAME" ]; then
                if gcloud artifacts repositories describe gcr.io --location=us >/dev/null 2>&1; then
                  IMAGE_BASE="gcr.io/${{ env.PROJECT_ID }}"
                  echo "Falling back to existing gcr.io repository in Artifact Registry."
                  gcloud auth configure-docker gcr.io --quiet
                else
                  REPO_NAME="reviewer-repo"
                  echo "Falling back to target repository name: $REPO_NAME"
                fi
              fi
            fi
          fi

          if [ -n "$IMAGE_BASE" ]; then
            echo "Selected container registry base: $IMAGE_BASE"
            IMAGE_TAG="${IMAGE_BASE}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
            LATEST_TAG="${IMAGE_BASE}/${{ env.SERVICE_NAME }}:latest"
          else
            echo "Selected Artifact Registry repository: $REPO_NAME in $REG_LOC"
            IMAGE_BASE="${REG_LOC}-docker.pkg.dev/${{ env.PROJECT_ID }}/${REPO_NAME}"
            IMAGE_TAG="${IMAGE_BASE}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
            LATEST_TAG="${IMAGE_BASE}/${{ env.SERVICE_NAME }}:latest"
          fi

          echo "Target Image Tag: $IMAGE_TAG"
          echo "Target Latest Tag: $LATEST_TAG"

          echo "=== 3. Build Docker Image ==="
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .

          echo "=== 4. Push Docker Image to Artifact Registry ==="
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: "--allow-unauthenticated --traffic=100"

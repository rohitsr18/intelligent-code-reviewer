name: Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Validate Dockerfile Build
        run: |
          docker build -t intelligent-code-reviewer:test .
          # Verify container runs non-root user (UID 10001)
          USER_ID=$(docker run --rm intelligent-code-reviewer:test id -u)
          if [ "$USER_ID" != "10001" ]; then
            echo "Error: Container must run as non-root user 10001 (appuser), found $USER_ID"
            exit 1
          fi
          echo "Verified non-root container security (UID $USER_ID)"

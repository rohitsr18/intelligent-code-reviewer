[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-code-reviewer"
version = "0.1.0"
description = "24/7 Intelligent Code Reviewer on GCP"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Engineering Team" }]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']

